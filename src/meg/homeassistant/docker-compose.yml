x-common: &common
  # DEFINED: [/asystem/.env_fab](https://github.com/ggear/asystem/blob/master/.env_fab)
  image: homeassistant/home-assistant:${ASYSTEM_HOMEASSISTANT_VERSION}
  user: root
  environment:
    - TZ=${TZ}
    - SERVICE_VERSION_COMPACT
    - HOMEASSISTANT_SERVICE
    - HOMEASSISTANT_HTTP_PORT
    - HOMEASSISTANT_DB
    - HOMEASSISTANT_INTERNAL_URL
    - HOMEASSISTANT_EXTERNAL_URL
    - HOMEASSISTANT_API_TOKEN
    - HOMEASSISTANT_WILLY_WEATHER_KEY
    - VERNEMQ_SERVICE
    - VERNEMQ_API_PORT
    - INFLUXDB_SERVICE
    - INFLUXDB_API_PORT
    - INFLUXDB_TOKEN_HOME
    - INFLUXDB_DATABASE_HOME
  volumes:
    - ${SERVICE_DATA_DIR}:/config
    - ${SERVICE_DATA_DIR}/bootstrap.sh:/asystem/etc/bootstrap.sh
    - ${SERVICE_DATA_DIR}/checkalive.sh:/asystem/etc/checkalive.sh
    - ${SERVICE_DATA_DIR}/checkexecuting.sh:/asystem/etc/checkexecuting.sh
    - ${SERVICE_DATA_DIR}/checkhealthy.sh:/asystem/etc/checkhealthy.sh
  working_dir: /asystem/etc
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "100m"
services:
  homeassistant:
    container_name: homeassistant
    <<: *common
    restart: ${SERVICE_RESTART}
    stop_grace_period: 30s

    # TODO: Cant deploy with network_mode host, need to think how to run locally
    #    ports:
    #      - ${HOMEASSISTANT_HTTP_PORT}:${HOMEASSISTANT_HTTP_PORT}

    network_mode: host
    healthcheck:
      test: /asystem/etc/checkhealthy.sh
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 15m
      start_interval: 10s
    deploy:
      resources:
        limits:
          memory: 2.5G
  homeassistant_bootstrap:
    container_name: homeassistant_bootstrap
    <<: *common
    restart: 'no'
    entrypoint: bash
    command: /asystem/etc/bootstrap.sh
    depends_on:
      - homeassistant
