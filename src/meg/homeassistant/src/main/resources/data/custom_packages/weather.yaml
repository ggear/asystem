#######################################################################################
willywindforecast:
  api_key: !env_var HOMEASSISTANT_WILLY_WEATHER_KEY
  forecast_days: 7
  poll_period_hours: 3
#######################################################################################
sensor:
  - platform: geo_rss_events
    name: DFES Incidents Metro South East
    radius: 30
    url: https://api.emergency.wa.gov.au/v1/rss/incidents?region=METRO%20NORTH%20EAST
#######################################################################################
rest:
  - resource: https://mlserver.proxy.janeandgraham.com/v2/models/homeassistant_weatherstation_battery_1001/infer
    method: POST
    headers:
      Content-Type: application/json
    timeout: 10
    scan_interval: 900
    payload_template: |-
      {%- set voltage = states('sensor.weatherstation_console_battery_voltage') | float(none) %}
      {%- set reported = states('input_number.weatherstation_console_battery_reported') | float(none) %}
      {
        "inputs": [
          {
            "name": "weatherstation_console_battery_voltage",
            "datatype": "FP64",
            "shape": [1],
            "data": [{{ (voltage if voltage is not none else 0.0) | tojson }}]
          },
          {
            "name": "weatherstation_console_battery_voltage_valid",
            "datatype": "INT64",
            "shape": [1],
            "data": [{{ 1 if voltage is not none else 0 }}]
          },
          {
            "name": "weatherstation_console_battery_reported",
            "datatype": "FP64",
            "shape": [1],
            "data": [{{ (reported if reported is not none else 0.0) | tojson }}]
          },
          {
            "name": "weatherstation_console_battery_reported_valid",
            "datatype": "INT64",
            "shape": [1],
            "data": [{{ 1 if reported is not none else 0 }}]
          },
          {
            "name": "clock_epoch_seconds",
            "datatype": "FP64",
            "shape": [1],
            "data": [{{ now().timestamp() | int }}]
          }
          {%- set saved = state_attr('sensor.mlserver_weatherstation_console_battery_capacity_pct', 'outputs') | default([], true) | selectattr('name', 'eq', 'state_out') | map(attribute='data') | first | default([], true) %}
          {%- if saved | length == 4 %},
          {
            "name": "state_in",
            "datatype": "FP64",
            "shape": [4],
            "data": [{{ saved | join(', ') }}]
          }
          {%- endif %}
        ]
      }
    sensor:
      - name: mlserver_weatherstation_console_battery_capacity_pct
        unique_id: mlserver_weatherstation_console_battery_capacity_pct
        availability: >-
          {{ value_json is defined and (value_json.outputs | default([]) | selectattr('name', 'eq', 'weatherstation_console_battery_capacity_pct_valid') | map(attribute='data') | first | default([0], true))[0] == 1 }}
        value_template: >-
          {{ (value_json.outputs | selectattr('name', 'eq', 'weatherstation_console_battery_capacity_pct') | map(attribute='data') | first)[0] }}
        json_attributes:
          - model_version
          - outputs
        device_class: battery
        state_class: measurement
        unit_of_measurement: "%"
#######################################################################################
input_number:
  #####################################################################################
  weatherstation_console_battery_reported:
    name: Console Battery Reported
    min: 0
    max: 4294967295
    step: 1
    mode: box
    unit_of_measurement: s
#######################################################################################
automation:
  #####################################################################################
  - id: weatherstation_console_battery_reported
    alias: "Weather Station: Record console battery voltage report time"
    mode: queued
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.weatherstation_console_battery_voltage') }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.weatherstation_console_battery_reported
        data:
          value: "{{ as_timestamp(states.sensor.weatherstation_console_battery_voltage.last_reported) | int }}"
#######################################################################################
