#######################################################################################
# WARNING: This file is written by the build process, any manual edits will be lost!
#######################################################################################
template:
  #####################################################################################
  - sensor:
      #################################################################################
      - unique_id: dining_air_purifier_pm25
        default_entity_id: sensor.template_dining_air_purifier_pm25
        device_class: pm25
        state_class: measurement
        unit_of_measurement: "µg/m³"
        state: '{{ states("sensor.dining_air_purifier_pm25") | float(None) }}'
        availability: >-
          {{ is_state('fan.dining_air_purifier', 'on') and states('sensor.dining_air_purifier_pm25') | float(-1) >= 0 }}
      #################################################################################
      - unique_id: lounge_air_purifier_pm25
        default_entity_id: sensor.template_lounge_air_purifier_pm25
        device_class: pm25
        state_class: measurement
        unit_of_measurement: "µg/m³"
        state: '{{ states("sensor.lounge_air_purifier_pm25") | float(None) }}'
        availability: >-
          {{ is_state('fan.lounge_air_purifier', 'on') and states('sensor.lounge_air_purifier_pm25') | float(-1) >= 0 }}
      #################################################################################
      - unique_id: parents_air_purifier_pm25
        default_entity_id: sensor.template_parents_air_purifier_pm25
        device_class: pm25
        state_class: measurement
        unit_of_measurement: "µg/m³"
        state: '{{ states("sensor.parents_air_purifier_pm25") | float(None) }}'
        availability: >-
          {{ is_state('fan.parents_air_purifier', 'on') and states('sensor.parents_air_purifier_pm25') | float(-1) >= 0 }}
      #################################################################################
      - unique_id: kitchen_air_purifier_pm25
        default_entity_id: sensor.template_kitchen_air_purifier_pm25
        device_class: pm25
        state_class: measurement
        unit_of_measurement: "µg/m³"
        state: '{{ states("sensor.kitchen_air_purifier_pm25") | float(None) }}'
        availability: >-
          {{ is_state('fan.kitchen_air_purifier', 'on') and states('sensor.kitchen_air_purifier_pm25') | float(-1) >= 0 }}
      #################################################################################
      - unique_id: utility_temperature_proxy
        default_entity_id: sensor.template_utility_temperature_proxy
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: '{{ states("sensor.compensation_sensor_utility_temperature") | float(None) }}'
      #################################################################################
      - unique_id: deck_festoons_plug_temperature_proxy
        default_entity_id: sensor.template_deck_festoons_plug_temperature_proxy
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: '{{ states("sensor.compensation_sensor_deck_festoons_plug_temperature") | float(None) }}'
      #################################################################################
      - unique_id: wardrobe_temperature_proxy
        default_entity_id: sensor.template_wardrobe_temperature_proxy
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: '{{ states("sensor.compensation_sensor_wardrobe_temperature") | float(None) }}'
#######################################################################################
