x-common: &common
  image: tasmota:${SERVICE_VERSION_ABSOLUTE}
  init: true
  environment:
    - TZ=Australia/Perth
    - SERVICE_VERSION_ABSOLUTE
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "100m"
services:
  tasmota:
    container_name: tasmota
    <<: *common
    restart: ${SERVICE_RESTART}
    ports:
      - ${TASMOTA_HTTP_PORT}:80
    healthcheck:
      test: /asystem/etc/checkhealthy.sh
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 1m
      start_interval: 10s
    deploy:
      resources:
        limits:
          memory: 16M
