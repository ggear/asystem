[package]
name = "consumer"
version = "0.0.0-SNAPSHOT"
edition = "2021"

[features]
default = ["model-wasm", "model-onnx"]
model-wasm = ["dep:wasmi"]
model-onnx = ["dep:ort"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
ort = { optional = true, version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
wasmi = { version = "2.0.0", optional = true }
