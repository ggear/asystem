x-common: &common
  image: supervisor:${SERVICE_VERSION_ABSOLUTE}
  init: true
  environment:
    - TZ=${TZ}
    - SERVICE_NAME
    - SUPERVISOR_HOST
    - SUPERVISOR_MOUNT
    - BROKER_HOST
    - BROKER_PORT
    - DATABASE_HOST
    - DATABASE_PORT
    - DATABASE_NAME
    - DATABASE_TOKEN
    - BROKER_TOKEN
  cap_add:
    - SYSLOG
    - SYS_RAWIO
    - SYS_ADMIN
  device_cgroup_rules:
    - "c 1:11 r"
    - "b 8:* r"
    - "b 259:* r"
  security_opt:
    - apparmor=unconfined
  volumes:
    - ${SERVICE_DATA_DIR}:/asystem/mnt
    - /var/run/docker.sock:/var/run/docker.sock
    - /:/${SUPERVISOR_MOUNT}:ro
    - /etc/fstab:/etc/fstab:ro
    - /var/lib/asystem/install:/var/lib/asystem/install:ro
    - /dev:/dev
    - /home/asystem:/home/asystem:rw
    - type: bind
      source: /share
      target: /share
      bind:
        propagation: rshared
        create_host_path: true
    - type: bind
      source: /backup
      target: /backup
      bind:
        propagation: rshared
        create_host_path: true
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "100m"
services:
  supervisor:
    container_name: supervisor
    <<: *common
    restart: ${SERVICE_RESTART}
    healthcheck:
      test: /asystem/etc/checkhealthy.sh
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 1m
      start_interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
