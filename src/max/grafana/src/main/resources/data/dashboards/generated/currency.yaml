                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          entity AS metric,
                          value AS value
                      FROM (
                          SELECT
                              $__timeGroupAlias(time, $__interval),
                              CASE entity WHEN 'AUD/USD' THEN 'USD/AUD' ELSE entity END AS entity,
                              'snapshot'                                                AS measure,
                              avg(1.0 / value)                                          AS value
                          FROM currency
                          WHERE
                              $__timeFilter(time)
                              AND type = 'snapshot'
                              AND period = '1d'
                              AND unit = '$'
                              AND entity IN ('AUD/USD')
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
