                      FROM (
                          SELECT
                              entity    AS entity,
                              max(time) AS latest
                          FROM currency
                          WHERE
                              type IN ('delta', 'snapshot')
                              AND time <= $__timeTo()::timestamptz
                              AND time > $__timeTo()::timestamptz - INTERVAL '2592000 seconds'
                          GROUP BY 1
