                          metric,
                          (value / first_value(value) OVER (PARTITION BY metric ORDER BY time) - 1) * 100 AS value
                      FROM (
                          SELECT
                              time,
                              entity AS metric,
                              value AS value
                          FROM (
                              SELECT
                                  $__timeGroupAlias(time, $__interval),
                                  CASE entity WHEN 'AUD/GBP' THEN 'GBP/AUD' WHEN 'AUD/SGD' THEN 'SGD/AUD' WHEN 'AUD/USD' THEN 'USD/AUD' ELSE entity END AS entity,
                                  'snapshot'                                                                                                            AS measure,
                                  avg(1.0 / value)                                                                                                      AS value
                              FROM currency
                              WHERE
                                  $__timeFilter(time)
                                  AND type = 'snapshot'
                                  AND period = '1d'
                                  AND unit = '$'
                              GROUP BY 1, 2
                          ) AS arms
                      ) AS series
                      ORDER BY time
