                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          entity AS metric,
                          value AS value
                      FROM (
                          SELECT
                              $__timeGroupAlias(time, $__interval),
                              CASE entity WHEN 'AUD/USD' THEN 'USD/AUD' ELSE entity END AS entity,
                              'delta'                                                   AS measure,
                              avg(10000.0 / (100 + value) - 100)                        AS value
                          FROM currency
                          WHERE
                              $__timeFilter(time)
                              AND type = 'delta'
                              AND period = '1d'
                              AND unit = '%'
                              AND entity IN ('AUD/USD')
                          GROUP BY 1, 2
                      ) AS arms
