                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(value * held) / NULLIF(sum(held), 0) AS value
                      FROM (
                          SELECT
                              status                                                                                                                          AS value,
                              to_unixtime(coalesce(lead(time) OVER (PARTITION BY concat(host, '/', service) ORDER BY time), $__timeTo())) - to_unixtime(time) AS held
                          FROM supervisor
                          WHERE
                              $__timeFilter(time)
                              AND module = 'supervisor'
                              AND host IS NOT NULL
                              AND service IS NOT NULL
                              AND status IS NOT NULL
                              AND service IN ('wrangle')
                      ) AS rows
                  version: v0
                refId: A
            queryOptions:
              interval: 6s
            transformations: []
