                              AND used_memory_trend IS NOT NULL
                              AND host IN (
                                  'macmini-mad', 'macmini-max', 'macmini-may', 'macmini-meg', 'raspbpi-jen',
                                  'raspbpi-jil'
                              )
                          GROUP BY 1, 2
                      ) AS arms
                      GROUP BY time, measure
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 6s
            transformations: []
        description: 'Generated: memory in use against the total installed, smoothed across the trend window'
