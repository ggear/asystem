                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          entity AS metric,
                          value AS value
                      FROM (
                          SELECT
                              $__timeGroupAlias(time, $__interval),
                              entity     AS entity,
                              'mean'     AS measure,
                              avg(value) AS value
                          FROM interest
                          WHERE
                              $__timeFilter(time)
                              AND type = 'mean'
                              AND period = '1mo'
                              AND unit = '%'
                              AND entity IN ('Bank')
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 1d
            transformations: []
