apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: finance
  name: interest
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: postgres-wrangle
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          EXTRACT(EPOCH FROM ($__timeTo()::timestamptz)::timestamptz) - EXTRACT(EPOCH FROM (max(time))::timestamptz) AS value
                      FROM interest
                      WHERE
                          $__timeFilter(time)
                          AND type IN ('mean')
                  version: v0
                refId: A
            queryOptions:
              interval: 1d
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 7776000
                  - color: red
                    value: 15552000
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
