    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: postgres-wrangle
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          EXTRACT(EPOCH FROM ($__timeTo()::timestamptz)::timestamptz) - EXTRACT(EPOCH FROM (max(time))::timestamptz) AS value
                      FROM equity
                      WHERE
                          $__timeFilter(time)
                          AND type IN (
                              'market-volume-spot', 'price-close', 'price-close-1d-change-percentage',
                              'price-close-30d-change-percentage', 'price-close-365d-change-percentage',
                              'price-close-90d-change-percentage', 'price-close-base',
                              'price-close-base-1d-change-percentage', 'price-close-base-30d-change-percentage',
                              'price-close-base-365d-change-percentage', 'price-close-base-90d-change-percentage',
                              'price-close-spot', 'price-close-spot-1d-change-percentage',
                              'price-close-spot-30d-change-percentage', 'price-close-spot-365d-change-percentage',
                              'price-close-spot-90d-change-percentage'
                          )
                  version: v0
                refId: A
            queryOptions:
              interval: 1d
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 518400
                  - color: red
                    value: 1036800
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
