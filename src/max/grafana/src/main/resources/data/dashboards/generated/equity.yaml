                              (SELECT count(DISTINCT entity) FROM equity WHERE type IN ( 'market-volume-spot', 'price-close', 'price-close-1d-change-percentage', 'price-close-30d-change-percentage', 'price-close-365d-change-percentage', 'price-close-90d-change-percentage', 'price-close-base', 'price-close-base-1d-change-percentage', 'price-close-base-30d-change-percentage', 'price-close-base-365d-change-percentage', 'price-close-base-90d-change-percentage', 'price-close-spot', 'price-close-spot-1d-change-percentage', 'price-close-spot-30d-change-percentage', 'price-close-spot-365d-change-percentage', 'price-close-spot-90d-change-percentage' ) AND time <= $__timeTo()::timestamptz AND time > $__timeTo()::timestamptz - INTERVAL '2592000 seconds') AS expected
                      ) AS arms
                  version: v0
                refId: A
            queryOptions:
