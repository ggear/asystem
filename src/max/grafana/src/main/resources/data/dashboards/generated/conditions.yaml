apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: home
  name: conditions
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          min(value) AS value
                      FROM (
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__temperature
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'compensation_sensor_roof_temperature', 'compensation_sensor_ada_temperature',
                                  'compensation_sensor_edwin_temperature',
                                  'compensation_sensor_office_lounge_temperature',
                                  'compensation_sensor_parents_temperature', 'compensation_sensor_office_temperature',
                                  'compensation_sensor_kitchen_temperature',
                                  'compensation_sensor_office_pantry_temperature',
                                  'compensation_sensor_office_dining_temperature',
                                  'compensation_sensor_laundry_temperature',
                                  'compensation_sensor_wardrobe_temperature',
                                  'compensation_sensor_utility_temperature',
                                  'compensation_sensor_office_basement_temperature'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__pm25
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'template_dining_air_purifier_pm25', 'template_lounge_air_purifier_pm25',
                                  'template_parents_air_purifier_pm25', 'template_kitchen_air_purifier_pm25'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__humidity
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'ada_humidity', 'edwin_humidity', 'office_lounge_humidity', 'parents_humidity',
                                  'office_humidity', 'kitchen_humidity', 'office_pantry_humidity',
                                  'office_dining_humidity', 'laundry_humidity', 'wardrobe_humidity',
                                  'office_basement_humidity'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__carbon_dioxide
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'edwin_carbon_dioxide', 'office_carbon_dioxide', 'office_lounge_carbon_dioxide',
                                  'kitchen_carbon_dioxide', 'office_pantry_carbon_dioxide',
                                  'office_dining_carbon_dioxide'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__sound_pressure
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'ada_noise', 'edwin_noise', 'parents_noise', 'office_noise', 'kitchen_noise',
                                  'laundry_noise'
                              )
                      ) AS arms
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
