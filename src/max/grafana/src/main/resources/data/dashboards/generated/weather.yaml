apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: home
  name: weather
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          min(value) AS value
                      FROM (
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__temperature
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'compensation_sensor_roof_temperature', 'roof_apparent_temperature',
                                  'roof_dew_point', 'roof_heat_index', 'roof_humidity_index',
                                  'roof_wind_chill_temperature'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__humidity
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN ('roof_humidity')
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'roof_cloud_base', 'roof_max_solar_radiation', 'roof_wind_gust_speed',
                                  'roof_hourly_rain', 'roof_daily_rain', 'roof_monthly_rain', 'roof_yearly_rain'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__pressure
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN ('roof_barometer_pressure')
                      ) AS arms
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 1209600
                  - color: red
                    value: 2419200
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-10:
