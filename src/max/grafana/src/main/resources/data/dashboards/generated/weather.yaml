        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      WITH events AS (
                          SELECT
                              time,
                              CASE entity_id WHEN 'roof_wind_gust_speed' THEN value END AS speed,
                              CASE entity_id WHEN 'roof_wind_gust_direction' THEN value END AS direction
                          FROM sensor
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND value IS NOT NULL
                              AND entity_id IN ('roof_wind_gust_speed', 'roof_wind_gust_direction')
                      ), runs AS (
                          SELECT
                              time,
                              speed,
                              direction,
                              count(speed) OVER (ORDER BY time, speed NULLS LAST ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS run
                          FROM events
                      ), held AS (
                          SELECT
                              time,
                              direction,
                              first_value(speed) OVER (PARTITION BY run ORDER BY time, speed NULLS LAST) AS speed
                          FROM runs
                      )
                      SELECT
                          $__dateBin(time) AS time,
                          'Gust Direction' AS metric,
                          (CASE WHEN degrees(atan2(avg(sin(radians(direction))), avg(cos(radians(direction))))) < -0.000001 THEN degrees(atan2(avg(sin(radians(direction))), avg(cos(radians(direction))))) + 360 ELSE abs(degrees(atan2(avg(sin(radians(direction))), avg(cos(radians(direction)))))) END) / 22.5 AS value
                      FROM held
                      WHERE
                          direction IS NOT NULL
                          AND speed > 5
                      GROUP BY 1
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
