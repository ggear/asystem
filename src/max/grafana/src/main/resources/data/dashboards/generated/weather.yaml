          version: ''
    panel-7:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          entity AS metric,
                          value AS value
                      FROM (
                          SELECT
                              $__dateBin(time)                                                                                                            AS time,
                              CASE entity_id WHEN 'compensation_sensor_roof_temperature' THEN 'Roof' ELSE concat(entity_id, '/', unit_of_measurement) END AS entity,
                              'value'                                                                                                                     AS measure,
                              max(value)                                                                                                                  AS value
                          FROM sensor__temperature
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND value IS NOT NULL
                              AND entity_id IN ('compensation_sensor_roof_temperature')
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions: {}
