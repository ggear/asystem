                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      WITH forecast AS (
                          SELECT
                              date_bin(INTERVAL '1 day', time, TIMESTAMP '1969-12-31T16:00:00') + INTERVAL '1 day' AS day,
                              CASE entity_id WHEN 'bom_darlington_temp_max_1' THEN 'Max' WHEN 'bom_darlington_temp_min_1' THEN 'Min' ELSE NULL END AS bound,
                              last_value(value ORDER BY time) AS value
                          FROM sensor__temperature
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND value IS NOT NULL
                              AND entity_id IN ('bom_darlington_temp_max_1', 'bom_darlington_temp_min_1')
                          GROUP BY 1, 2
                      ), observed AS (
                          SELECT
                              date_bin(INTERVAL '1 day', time, TIMESTAMP '1969-12-31T16:00:00') AS day,
                              max(value) AS high,
                              min(value) AS low
                          FROM sensor__temperature
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND value IS NOT NULL
                              AND entity_id IN ('compensation_sensor_roof_temperature')
                              AND time < date_bin(INTERVAL '1 day', $__timeTo(), TIMESTAMP '1969-12-31T16:00:00')
                          GROUP BY 1
                      )
                      SELECT day AS time, 'Forecast ' || bound AS metric, value FROM forecast
                      UNION ALL
                      SELECT day AS time, 'Observed Max' AS metric, high AS value FROM observed
                      UNION ALL
                      SELECT day AS time, 'Observed Min' AS metric, low AS value FROM observed
                      UNION ALL
                      SELECT observed.day AS time, forecast.bound || ' Error' AS metric,
                          CASE forecast.bound WHEN 'Max' THEN observed.high ELSE observed.low END - forecast.value AS value
                      FROM observed JOIN forecast ON observed.day = forecast.day
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 'Hand-written: BOM''s next-day forecast against the observed roof temperature per Perth day, with the error as bars'
