                                  )
                                  AND time <= $__timeTo()
                                  AND time > $__timeTo() - INTERVAL '2592000 seconds'
                              GROUP BY 1
                          ) AS entities
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(min(latest)) AS value
                          FROM (
                              SELECT
                                  entity_id AS entity,
                                  max(time) AS latest
                              FROM sensor__humidity
                              WHERE
