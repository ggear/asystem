                  showPoints: never
                  spanNulls: true
                decimals: 1
                displayName: ${__field.labels.metric}
                unit: celsius
              overrides:
              - matcher:
                  id: byRegexp
                  options: /Max/
                properties:
                - id: color
                  value:
                    fixedColor: orange
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /Min/
                properties:
                - id: color
                  value:
                    fixedColor: blue
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /Forecast/
                properties:
                - id: custom.lineStyle
                  value:
                    dash:
                    - 10
                    - 10
                    fill: dash
              - matcher:
                  id: byRegexp
                  options: /Error/
                properties:
                - id: custom.drawStyle
                  value: bars
                - id: custom.fillOpacity
                  value: 50
                - id: custom.barWidthFactor
                  value: 0.15
                - id: custom.axisPlacement
                  value: right
              - matcher:
                  id: byRegexp
                  options: /Max Error/
                properties:
                - id: custom.barAlignment
                  value: -1
              - matcher:
                  id: byRegexp
                  options: /Min Error/
                properties:
                - id: custom.barAlignment
                  value: 1
            options:
              legend:
                calcs:
                - min
                - max
                - mean
                displayMode: table
                placement: right
                showLegend: true
                width: 400
              tooltip:
                mode: multi
                sort: desc
          version: ''
