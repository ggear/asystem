      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(reported) / NULLIF(sum(expected), 0) AS value
                      FROM (
                          SELECT
                              (SELECT count(*) FROM sensor__temperature WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ( 'compensation_sensor_roof_temperature', 'roof_apparent_temperature', 'roof_dew_point', 'roof_heat_index', 'roof_humidity_index', 'roof_wind_chill_temperature' ) AND to_unixtime(time) > (3 * to_unixtime($__timeTo()) + to_unixtime($__timeFrom())) / 4) AS reported,
                              (SELECT count(*) FROM sensor__temperature WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ( 'compensation_sensor_roof_temperature', 'roof_apparent_temperature', 'roof_dew_point', 'roof_heat_index', 'roof_humidity_index', 'roof_wind_chill_temperature' )) / 4.0 AS expected
                          UNION ALL
                          SELECT
                              (SELECT count(*) FROM sensor__humidity WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ('roof_humidity') AND to_unixtime(time) > (3 * to_unixtime($__timeTo()) + to_unixtime($__timeFrom())) / 4) AS reported,
                              (SELECT count(*) FROM sensor__humidity WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ('roof_humidity')) / 4.0 AS expected
                          UNION ALL
                          SELECT
                              (SELECT count(*) FROM sensor WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ( 'roof_cloud_base', 'roof_max_solar_radiation', 'roof_wind_gust_speed', 'roof_hourly_rain', 'roof_daily_rain', 'roof_monthly_rain', 'roof_yearly_rain' ) AND to_unixtime(time) > (3 * to_unixtime($__timeTo()) + to_unixtime($__timeFrom())) / 4) AS reported,
                              (SELECT count(*) FROM sensor WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ( 'roof_cloud_base', 'roof_max_solar_radiation', 'roof_wind_gust_speed', 'roof_hourly_rain', 'roof_daily_rain', 'roof_monthly_rain', 'roof_yearly_rain' )) / 4.0 AS expected
                          UNION ALL
                          SELECT
                              (SELECT count(*) FROM sensor__pressure WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ('roof_barometer_pressure') AND to_unixtime(time) > (3 * to_unixtime($__timeTo()) + to_unixtime($__timeFrom())) / 4) AS reported,
                              (SELECT count(*) FROM sensor__pressure WHERE $__timeFilter(time) AND module = 'homeassistant' AND entity_id IN ('roof_barometer_pressure')) / 4.0 AS expected
                      ) AS arms
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 'Generated: Rows in the last quarter of the window as a share of the average quarter'
        id: 6
        links: []
        title: Volume
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
                  - color: yellow
                    value: 50
                  - color: green
                    value: 80
                  - color: yellow
                    value: 120
                  - color: red
                    value: 150
                unit: percent
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
