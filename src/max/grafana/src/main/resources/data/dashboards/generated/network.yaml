                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          entity AS metric,
                          value AS value
                      FROM (
                          SELECT
                              $__dateBin(time)     AS time,
                              target               AS entity,
                              'reachable'          AS measure,
                              avg(reachable * 100) AS value
                          FROM internet
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND target IS NOT NULL
                              AND reachable IS NOT NULL
                              AND target IN ('gateway')
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: target answered at least one ping across the window'
