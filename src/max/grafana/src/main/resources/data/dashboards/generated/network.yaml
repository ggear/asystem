                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(value * held) / NULLIF(sum(held), 0) AS value
                      FROM (
                          SELECT
                              status                                                                                                                          AS value,
