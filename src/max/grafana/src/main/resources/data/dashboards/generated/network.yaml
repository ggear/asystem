                              AND module = 'network'
                              AND experience IS NOT NULL
                              AND device IS NULL
                              AND router IS NULL
                              AND experience_pct IS NOT NULL
                              AND experience IN ('router')
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
