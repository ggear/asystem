                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          measure AS metric,
                          sum(value) AS value
                      FROM (
                          SELECT
                              $__dateBin(time) AS time,
                              accesspoint      AS entity,
                              'clients'        AS measure,
                              avg(clients)     AS value
                          FROM wireless
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND accesspoint IS NOT NULL
                              AND clients IS NOT NULL
                          GROUP BY 1, 2
                      ) AS arms
                      GROUP BY time, measure
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
