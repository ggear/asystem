                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          measure AS metric,
                          min(value) AS value
                      FROM (
                          SELECT
                              $__dateBin(time)    AS time,
                              accesspoint         AS entity,
                              'experience_pct'    AS measure,
                              avg(experience_pct) AS value
                          FROM wireless
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND accesspoint IS NOT NULL
                              AND experience_pct IS NOT NULL
