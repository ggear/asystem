apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: systems
  name: network
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                      FROM wireless
                      WHERE
                          $__timeFilter(time)
                          AND module = 'network'
                          AND accesspoint IS NOT NULL
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 1800
                  - color: red
                    value: 3600
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          measure AS metric,
                          min(value) AS value
                      FROM (
                          SELECT
                              $__dateBin(time)    AS time,
                              switch              AS entity,
                              'experience_pct'    AS measure,
                              avg(experience_pct) AS value
                          FROM ethernet
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND switch IS NOT NULL
                              AND powered IS NULL
                              AND experience_pct IS NOT NULL
                          GROUP BY 1, 2
                      ) AS arms
                      GROUP BY time, measure
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: experience reported by the controller, capped by processor, memory and busiest link headroom'
        id: 10
        links: []
        title: Wired Experience
        vizConfig:
