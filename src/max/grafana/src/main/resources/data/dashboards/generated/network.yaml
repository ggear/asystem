                              avg(experience_pct) AS value
                          FROM zigbee
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND experience IS NOT NULL
                              AND device IS NULL
                              AND experience_pct IS NOT NULL
                              AND experience IN ('router')
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
