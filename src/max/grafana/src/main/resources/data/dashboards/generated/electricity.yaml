    panel-3:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(value * held) / NULLIF(sum(held), 0) AS value
                      FROM (
                          SELECT
                              status                                                                                                                          AS value,
                              to_unixtime(coalesce(lead(time) OVER (PARTITION BY concat(host, '/', service) ORDER BY time), $__timeTo())) - to_unixtime(time) AS held
                          FROM supervisor
                          WHERE
                              $__timeFilter(time)
                              AND module = 'supervisor'
                              AND host IS NOT NULL
                              AND service IS NOT NULL
                              AND status IS NOT NULL
                              AND service IN ('homeassistant')
                      ) AS rows
                  version: v0
                refId: A
            queryOptions:
              interval: 6s
            transformations: []
        description: 'Generated: Share of the window the homeassistant service was up'
        id: 3
        links: []
        title: Availability
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
