apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: home
  name: electricity
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          min(value) AS value
                      FROM (
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__power
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'home_power', 'home_base_power', 'home_peak_power', 'lights_power', 'fans_power',
                                  'all_standby_power', 'coffee_machine_power', 'pool_filter_power',
                                  'water_booster_power', 'dish_washer_power', 'kitchen_fridge_power',
                                  'deck_freezer_power', 'towel_rails_power', 'audio_visual_devices_power',
                                  'servers_network_power'
                              )
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                          FROM sensor__energy
                          WHERE
                              $__timeFilter(time)
                              AND module = 'homeassistant'
                              AND entity_id IN (
                                  'home_energy_daily', 'home_base_energy_daily', 'home_peak_energy_daily',
                                  'lights_energy_daily', 'fans_energy_daily', 'all_standby_energy_daily',
                                  'coffee_machine_energy_daily', 'pool_filter_energy_daily',
                                  'water_booster_energy_daily', 'dish_washer_energy_daily',
                                  'kitchen_fridge_energy_daily', 'deck_freezer_energy_daily',
                                  'towel_rails_energy_daily', 'audio_visual_devices_energy_daily',
                                  'servers_network_energy_daily'
                              )
                      ) AS arms
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 1209600
                  - color: red
                    value: 2419200
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
