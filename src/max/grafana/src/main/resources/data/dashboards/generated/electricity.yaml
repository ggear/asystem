    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(reported) / NULLIF(sum(expected), 0) AS value
                      FROM (
