                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          max(value) AS value
                      FROM (
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(min(latest)) AS value
                          FROM (
                              SELECT
                                  entity_id AS entity,
                                  max(time) AS latest
                              FROM sensor__power
                              WHERE
                                  module = 'homeassistant'
                                  AND entity_id IN (
                                      'home_power', 'home_base_power', 'home_peak_power', 'lights_power', 'fans_power',
                                      'all_standby_power', 'coffee_machine_power', 'pool_filter_power',
                                      'water_booster_power', 'dish_washer_power', 'kitchen_fridge_power',
                                      'deck_freezer_power', 'towel_rails_power', 'audio_visual_devices_power',
                                      'servers_network_power'
                                  )
                                  AND time <= $__timeTo()
                                  AND time > $__timeTo() - INTERVAL '2592000 seconds'
                              GROUP BY 1
                          ) AS entities
                          UNION ALL
                          SELECT
                              to_unixtime($__timeTo()) - to_unixtime(min(latest)) AS value
                          FROM (
                              SELECT
                                  entity_id AS entity,
                                  max(time) AS latest
                              FROM sensor__energy
                              WHERE
                                  module = 'homeassistant'
                                  AND entity_id IN (
