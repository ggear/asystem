                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 50
                  - color: red
                    value: 100
                unit: ms
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
