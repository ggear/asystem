                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          measure AS metric,
                          avg(value) AS value
                      FROM (
                          SELECT
                              $__dateBin(time)     AS time,
                              target               AS entity,
                              'reachable'          AS measure,
                              avg(reachable * 100) AS value
                          FROM internet
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND target IS NOT NULL
                              AND reachable IS NOT NULL
                              AND target IN ('1.1.1.1', '8.8.8.8', '9.9.9.9')
                          GROUP BY 1, 2
                      ) AS arms
                      GROUP BY time, measure
                      ORDER BY time
