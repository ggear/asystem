        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 1800
                  - color: red
                    value: 3600
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-3:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(value * held) / NULLIF(sum(held), 0) AS value
                      FROM (
                          SELECT
                              status                                                                                                                          AS value,
                              to_unixtime(coalesce(lead(time) OVER (PARTITION BY concat(host, '/', service) ORDER BY time), $__timeTo())) - to_unixtime(time) AS held
                          FROM supervisor
                          WHERE
                              $__timeFilter(time)
                              AND module = 'supervisor'
                              AND host IS NOT NULL
                              AND service IS NOT NULL
                              AND status IS NOT NULL
                              AND service IN ('network')
                      ) AS rows
                  version: v0
                refId: A
            queryOptions:
              interval: 6s
            transformations: []
        description: 'Generated: Share of the window the network service was up'
        id: 3
        links: []
        title: Availability
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
                  - color: yellow
                    value: 99
                  - color: green
                    value: 99.5
                unit: percent
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(reported) / NULLIF(sum(expected), 0) AS value
                      FROM (
                          SELECT
                              (SELECT count(DISTINCT target) FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL AND time > (SELECT max(time) FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL) - INTERVAL '1800 seconds') AS reported,
                              (SELECT count(DISTINCT target) FROM internet WHERE module = 'network' AND target IS NOT NULL AND time <= $__timeTo() AND time > $__timeTo() - INTERVAL '2592000 seconds') AS expected
                      ) AS arms
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: Share of recently active entities reporting in the latest batch'
        id: 4
        links: []
        title: Entities
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
                  - color: yellow
                    value: 80
                  - color: green
                    value: 100
                unit: percent
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-5:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(reported) / NULLIF(sum(expected), 0) AS value
                      FROM (
                          SELECT
                              (SELECT CASE WHEN count(reachable) > 0 THEN 1 ELSE 0 END + CASE WHEN count(loss_pct) > 0 THEN 1 ELSE 0 END + CASE WHEN count(rtt_ms) > 0 THEN 1 ELSE 0 END + CASE WHEN count(jitter_ms) > 0 THEN 1 ELSE 0 END FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL AND time > (SELECT max(time) FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL) - INTERVAL '1800 seconds') AS reported,
                              (SELECT CASE WHEN count(reachable) > 0 THEN 1 ELSE 0 END + CASE WHEN count(loss_pct) > 0 THEN 1 ELSE 0 END + CASE WHEN count(rtt_ms) > 0 THEN 1 ELSE 0 END + CASE WHEN count(jitter_ms) > 0 THEN 1 ELSE 0 END FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL) AS expected
                      ) AS arms
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: Share of measures written in the window that reported in the latest batch'
        id: 5
        links: []
        title: Metrics
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
                  - color: yellow
                    value: 80
                  - color: green
                    value: 100
                unit: percent
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
