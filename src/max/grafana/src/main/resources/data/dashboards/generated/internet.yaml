apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: systems
  name: internet
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                      FROM internet
                      WHERE
                          $__timeFilter(time)
                          AND module = 'network'
                          AND target IS NOT NULL
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 1800
                  - color: red
                    value: 3600
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          measure AS metric,
                          avg(value) AS value
                      FROM (
                          SELECT
                              $__dateBin(time) AS time,
                              target           AS entity,
                              'rtt_ms'         AS measure,
                              avg(rtt_ms)      AS value
                          FROM internet
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND target IS NOT NULL
                              AND rtt_ms IS NOT NULL
                              AND target IN ('1.1.1.1', '8.8.8.8', '9.9.9.9')
                          GROUP BY 1, 2
                      ) AS arms
                      GROUP BY time, measure
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: mean round trip time across the window'
