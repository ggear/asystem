                    rawSql: |-
                      SELECT
                          time,
                          entity AS metric,
                          value AS value
                      FROM (
                          SELECT
                              $__dateBin(time) AS time,
                              endpoint         AS entity,
                              'verified'       AS measure,
                              avg(verified)    AS value
                          FROM certificate
                          WHERE
                              $__timeFilter(time)
                              AND module = 'network'
                              AND endpoint IS NOT NULL
                              AND verified IS NOT NULL
                          GROUP BY 1, 2
                      ) AS arms
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: endpoint reachable and its certificate verified'
        id: 17
        links: []
        title: Certificate Verified
        vizConfig:
          group: state-timeline
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                custom:
                  fillOpacity: 80
                  lineWidth: 0
                decimals: 2
                displayName: ${__field.labels.metric}
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
                  - color: green
                    value: 1
                unit: none
              overrides: []
            options:
              alignValue: left
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: false
              mergeValues: true
              perPage: 20
              rowHeight: 0.8
              showValue: never
              tooltip:
                mode: single
                sort: asc
          version: ''
    panel-2:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          to_unixtime($__timeTo()) - to_unixtime(min(latest)) AS value
                      FROM (
                          SELECT
                              target    AS entity,
                              max(time) AS latest
                          FROM internet
                          WHERE
                              module = 'network'
                              AND target IS NOT NULL
                              AND time <= $__timeTo()
                              AND time > $__timeTo() - INTERVAL '2592000 seconds'
                          GROUP BY 1
                      ) AS entities
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: Time from the stalest entity''s last report to the end of the window'
        id: 2
        links: []
