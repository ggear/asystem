              textMode: value
              wideLayout: true
          version: ''
    panel-6:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          100.0 * sum(reported) / NULLIF(sum(expected), 0) AS value
                      FROM (
                          SELECT
                              (SELECT count(*) FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL AND to_unixtime(time) > (3 * to_unixtime($__timeTo()) + to_unixtime($__timeFrom())) / 4) AS reported,
                              (SELECT count(*) FROM internet WHERE $__timeFilter(time) AND module = 'network' AND target IS NOT NULL) / 4.0 AS expected
                      ) AS arms
                  version: v0
                refId: A
            queryOptions:
              interval: 15m
            transformations: []
        description: 'Generated: Rows in the last quarter of the window as a share of the average quarter'
        id: 6
        links: []
        title: Volume
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: null
                  - color: yellow
                    value: 50
                  - color: green
                    value: 80
                  - color: yellow
                    value: 120
                  - color: red
                    value: 150
                unit: percent
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
