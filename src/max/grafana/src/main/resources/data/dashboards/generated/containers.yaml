apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: systems
  name: containers
spec:
  annotations: []
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          to_unixtime($__timeTo()) - to_unixtime(max(time)) AS value
                      FROM supervisor
                      WHERE
                          $__timeFilter(time)
                          AND module = 'supervisor'
                          AND host IS NOT NULL
                          AND service IS NOT NULL
                          AND service IN (
                              'cloudflare', 'grafana', 'homeassistant', 'influxdb3', 'letsencrypt', 'mariadb',
                              'mlflow', 'mlserver', 'network', 'nginx', 'openra', 'plex', 'postgres', 'sabnzbd',
                              'sonarr', 'supervisor', 'tasmota', 'tempstat', 'vernemq', 'weewx', 'wrangle',
                              'zigbee2mqtt'
                          )
                  version: v0
                refId: A
            queryOptions:
              interval: 6s
            transformations: []
        description: 'Generated: Time from the most recent report by any entity to the end of the window'
        id: 1
        links: []
        title: Newest
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: null
                  - color: yellow
                    value: 600
                  - color: red
                    value: 1200
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: influxdb3-home
                  group: influxdb
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                          time,
                          measure AS metric,
                          avg(value) AS value
                      FROM (
                          SELECT
                              $__dateBin(time)           AS time,
                              concat(host, '/', service) AS entity,
                              'status'                   AS measure,
                              avg(status * 100)          AS value
                          FROM supervisor
                          WHERE
                              $__timeFilter(time)
                              AND module = 'supervisor'
                              AND host IS NOT NULL
                              AND service IS NOT NULL
                              AND status IS NOT NULL
                              AND service IN (
                                  'cloudflare', 'grafana', 'homeassistant', 'influxdb3', 'letsencrypt', 'mariadb',
                                  'mlflow', 'mlserver', 'network', 'nginx', 'openra', 'plex', 'postgres', 'sabnzbd',
                                  'sonarr', 'supervisor', 'tasmota', 'tempstat', 'vernemq', 'weewx', 'wrangle',
                                  'zigbee2mqtt'
                              )
                          GROUP BY 1, 2
                      ) AS arms
                      GROUP BY time, measure
                      ORDER BY time
                  version: v0
                refId: A
            queryOptions:
              interval: 6s
            transformations: []
        description: 'Generated: service is running and reporting metrics'
        id: 10
        links: []
        title: Running Rate
        vizConfig:
