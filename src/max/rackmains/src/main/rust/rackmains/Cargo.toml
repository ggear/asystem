[package]
name = "rackmains"
version = "0.0.0-SNAPSHOT"
edition = "2021"
publish = false

[workspace]
members = ["tools/schema"]

[features]
model-wasm = ["dep:wasmi"]
model-onnx = ["dep:ort"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
humantime = "2"
log = "0.4"
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
wasmi = { version = "2.0.0", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"], optional = true }

[profile.release]
strip = true
lto = true
