x-common: &common
  image: influxdb3:${SERVICE_VERSION_ABSOLUTE}
  init: true
  environment:
    - TZ=Australia/Perth
    - SERVICE_VERSION_ABSOLUTE
    - INFLUXDB3_SERVICE
    - INFLUXDB3_API_PORT
    - INFLUXDB3_HOST_URL=http://${INFLUXDB3_SERVICE}:${INFLUXDB3_API_PORT}
    - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_TOKEN_ADMIN}
    - INFLUXDB3_TOKEN_ADMIN
    - INFLUXDB3_TOKEN_HOME
    - INFLUXDB3_DATABASE_HOME
    - INFLUXDB3_HTTP_BIND_ADDR=0.0.0.0:8181
    - INFLUXDB3_OBJECT_STORE=file
    - INFLUXDB3_DATA_DIR=/asystem/mnt
    - INFLUXDB3_NODE_ID=node_1
    - INFLUXDB3_CLUSTER_ID=cluster_1
    - INFLUXDB3_GEN1_DURATION=10m
    - INFLUXDB3_COMPACTION_GEN2_DURATION=6h
    - INFLUXDB3_COMPACTION_MULTIPLIERS=4,7,4
    - INFLUXDB3_COMPACTION_MAX_NUM_FILES_PER_PLAN=1000000
    - INFLUXDB3_LICENSE_TYPE=home
    - INFLUXDB3_LICENSE_EMAIL=${INFLUXDB3_EMAIL}
    - INFLUXDB3_ADMIN_TOKEN_FILE=/asystem/mnt/cluster_1/admin.json
    - INFLUXDB3_PERMISSION_TOKENS_FILE=/asystem/mnt/cluster_1/init.json
    - INFLUXDB3_DISABLE_TELEMETRY_UPLOAD=true
    - INFLUXDB3_UNSET_VARS=LOG_FILTER
    - INFLUXDB3_LOG_FILTER=info
    - INFLUXDB3_BACKUP_ENABLED
    - INFLUXDB3_BACKUP_MIN_INTERVAL
    - INFLUXDB3_BACKUP_CHAIN_MAX
    - INFLUXDB3_BACKUP_KEEP_CHAINS
    - INFLUXDB3_BACKUP_TIMEOUT
    - INFLUXDB3_BACKUP_PROGRESS_INTERVAL
  volumes:
    - ${SERVICE_DATA_DIR}:/asystem/mnt
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "100m"
services:
  influxdb3:
    container_name: influxdb3
    <<: *common
    restart: ${SERVICE_RESTART}
    stop_grace_period: 30s
    ports:
      - ${INFLUXDB3_API_PORT}:8181
    healthcheck:
      test: /asystem/etc/checkhealthy.sh
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 1m
      start_interval: 10s
    deploy:
      resources:
        limits:
          memory: 5G
  influxdb3_bootstrap:
    container_name: influxdb3_bootstrap
    <<: *common
    restart: 'no'
    entrypoint: bash
    command: /asystem/etc/bootstrap.sh
    depends_on:
      - influxdb3
