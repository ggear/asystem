x-common: &common
  image: influxdb:${SERVICE_VERSION_ABSOLUTE}
  init: true
  environment:
    - TZ=Australia/Perth
    - SERVICE_VERSION_ABSOLUTE
    - INFLUXDB_SERVICE
    - INFLUXDB_API_PORT
    - INFLUXDB3_HOST_URL=http://${INFLUXDB_SERVICE}:${INFLUXDB_API_PORT}
    - INFLUXDB3_AUTH_TOKEN=${INFLUXDB_TOKEN_ADMIN}
    - INFLUXDB_TOKEN_ADMIN
    - INFLUXDB_TOKEN_HOME
    - INFLUXDB_DATABASE_HOME
    - INFLUXDB3_HTTP_BIND_ADDR=0.0.0.0:8181
    - INFLUXDB3_OBJECT_STORE=file
    - INFLUXDB3_DATA_DIR=/asystem/mnt
    - INFLUXDB3_NODE_ID=node_1
    - INFLUXDB3_CLUSTER_ID=cluster_1
    - INFLUXDB3_GEN1_DURATION=10m
    - INFLUXDB3_COMPACTION_GEN2_DURATION=6h
    - INFLUXDB3_COMPACTION_MULTIPLIERS=4,7,4
    - INFLUXDB3_COMPACTION_MAX_NUM_FILES_PER_PLAN=1000000
    - INFLUXDB3_LICENSE_TYPE=home
    - INFLUXDB3_LICENSE_EMAIL=${INFLUXDB_EMAIL}
    - INFLUXDB3_ADMIN_TOKEN_FILE=/asystem/mnt/cluster_1/admin.json
    - INFLUXDB3_PERMISSION_TOKENS_FILE=/asystem/mnt/cluster_1/init.json
    - INFLUXDB3_DISABLE_TELEMETRY_UPLOAD=true
    - INFLUXDB3_UNSET_VARS=LOG_FILTER
    - INFLUXDB3_LOG_FILTER=info,iox_query::query_log=warn,influxdb3_query_executor::enterprise=warn,influxdb3_pacha_tree::ingest=warn,influxdb3_pacha_tree::enterprise::compactor=warn
  volumes:
    - ${SERVICE_DATA_DIR}:/asystem/mnt
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "100m"
services:
  influxdb:
    container_name: influxdb
    <<: *common
    restart: ${SERVICE_RESTART}
    stop_grace_period: 30s
    ports:
      - ${INFLUXDB_API_PORT}:8181
    healthcheck:
      test: /asystem/etc/checkhealthy.sh
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 1m
      start_interval: 10s
    deploy:
      resources:
        limits:
          memory: 7G
  influxdb_bootstrap:
    container_name: influxdb_bootstrap
    <<: *common
    restart: 'no'
    entrypoint: bash
    command: /asystem/etc/bootstrap.sh
    depends_on:
      - influxdb
